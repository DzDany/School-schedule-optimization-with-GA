<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimizador de horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%231e3a8a'>📅</text></svg>">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>Horarios Generados</h1>
            <p>Visualización del horario optimizado por Algoritmo Genético</p>
        </header>

        <div class="controls-container">
            <div class="action-controls">
                <div class="input-wrapper">
                    <label for="maxHorasLibres">Máx. horas libres por día:</label>
                    <input type="number" id="maxHorasLibres" value="3" min="0" max="17">
                </div>
                <button id="btnGenerar" class="action-btn primary-btn">Generar horario</button>
                <button id="btnDescargar" class="action-btn secondary-btn" onclick="descargarPDF()">Descargar PDF</button>
            </div>
            <div class="group-selector" id="selectorGrupo">
                <!-- Group buttons will be generated here -->
            </div>
        </div>

        <div class="schedule-container" id="contenedorHorario">
            <!-- Tables will be generated here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
